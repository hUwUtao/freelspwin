name: Build LSP Plugins for Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: LSP Plugins source release version
        required: true
        default: 1.2.35
      toolchain:
        description: Windows C and C++ toolchain
        type: choice
        options: [gcc, clang]
        required: true
        default: gcc

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      LSP_VERSION: ${{ inputs.version || '1.2.35' }}
      TOOLCHAIN: ${{ inputs.toolchain || 'gcc' }}

    steps:
      - name: Install MinGW-w64 and GNU Make
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ inputs.toolchain == 'clang' && 'CLANG64' || 'UCRT64' }}
          update: true
          install: >-
            git
            make
            ${{ inputs.toolchain == 'clang' && 'mingw-w64-clang-x86_64-toolchain' || 'mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils' }}

      - name: Download source release
        shell: pwsh
        run: |
          $archive = "lsp-plugins-src-$env:LSP_VERSION.tar.gz"
          $url = "https://github.com/sadko4u/lsp-plugins/releases/download/$env:LSP_VERSION/$archive"
          Invoke-WebRequest -Uri $url -OutFile $archive
          tar -xzf $archive
          $makefile = Get-ChildItem -Recurse -Filter Makefile | Where-Object { Test-Path (Join-Path $_.DirectoryName 'project.mk') } | Select-Object -First 1
          if (-not $makefile) { throw 'Could not find the LSP Plugins source directory (Makefile and project.mk).' }
          $sourceDir = [IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $makefile.DirectoryName).Replace('\', '/')
          "LSP_SOURCE_DIR=$sourceDir" >> $env:GITHUB_ENV

      - name: Configure, build, and install
        shell: msys2 {0}
        env:
          CC: ${{ inputs.toolchain == 'clang' && 'clang' || 'gcc' }}
          CXX: ${{ inputs.toolchain == 'clang' && 'clang++' || 'g++' }}
        run: |
          cd "$LSP_SOURCE_DIR"
          make clean
          make config FEATURES="clap ladspa lv2 vst2 vst3 ui" CC="$CC" CXX="$CXX"
          make -j"$(nproc)" CC="$CC" CXX="$CXX"
          make install

      - name: Upload Windows plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-windows-x86_64-${{ env.LSP_VERSION }}-${{ env.TOOLCHAIN }}
          path: ${{ env.LSP_SOURCE_DIR }}/INSTALL/
          if-no-files-found: error
          compression-level: 9
