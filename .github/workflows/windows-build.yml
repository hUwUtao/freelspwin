name: Build LSP Plugins for Windows

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: LSP Plugins source release version
        required: true
        default: 1.2.35
      toolchain:
        description: Windows C and C++ toolchain
        type: choice
        options: [gcc, clang]
        required: true
        default: clang

permissions:
  contents: write

jobs:
  build:
    runs-on: blacksmith-2vcpu-windows-2025
    env:
      LSP_VERSION: ${{ inputs.version || github.event.release.tag_name || '1.2.35' }}
      TOOLCHAIN: ${{ inputs.toolchain || 'clang' }}

    steps:
      - name: Install MinGW-w64 and GNU Make
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            ccache
            ${{ inputs.toolchain == 'gcc' && 'mingw-w64-ucrt-x86_64-gcc' || 'mingw-w64-ucrt-x86_64-clang' }}
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-winpthreads

      - name: Download source release
        id: source
        shell: pwsh
        run: |
          $version = $env:LSP_VERSION -replace '^v', ''
          $env:LSP_VERSION = $version
          "LSP_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          $archive = "lsp-plugins-src-$version.tar.gz"
          $url = "https://github.com/sadko4u/lsp-plugins/releases/download/$version/$archive"
          Invoke-WebRequest -Uri $url -OutFile $archive
          tar -xzf $archive
          $makefile = Get-ChildItem -Recurse -Filter Makefile | Where-Object { Test-Path (Join-Path $_.DirectoryName 'project.mk') } | Select-Object -First 1
          if (-not $makefile) { throw 'Could not find the LSP Plugins source directory (Makefile and project.mk).' }
          $sourceDir = [IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $makefile.DirectoryName).Replace('\', '/')
          "LSP_SOURCE_DIR=$sourceDir" >> $env:GITHUB_ENV

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ env.TOOLCHAIN }}-${{ steps.source.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ env.TOOLCHAIN }}-${{ steps.source.outputs.version }}-

      - name: Configure, build, and install
        shell: msys2 {0}
        env:
          # GNU ld's partial links do not handle Clang address-significance sections.
          CC: ${{ inputs.toolchain == 'gcc' && 'ccache gcc' || 'ccache clang -fno-addrsig' }}
          CXX: ${{ inputs.toolchain == 'gcc' && 'ccache g++' || 'ccache clang++ -fno-addrsig' }}
        run: |
          export CCACHE_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/.ccache"
          export CCACHE_BASEDIR="$(cygpath -u "$GITHUB_WORKSPACE")"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_MAXSIZE=3G
          cd "$LSP_SOURCE_DIR"
          make clean
          make config FEATURES="clap ladspa lv2 vst2 vst3 ui" CC="$CC" CXX="$CXX"
          make -j2 CC="$CC" CXX="$CXX"
          make install
          cp /ucrt64/bin/libwinpthread-1.dll INSTALL/
          ccache --show-stats

      - name: Save ccache
        if: always() && steps.ccache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ env.TOOLCHAIN }}-${{ steps.source.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidatePaths = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            )
            $isccPath = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($isccPath) { $iscc = Get-Item $isccPath }
          }
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if (-not $iscc) {
              $isccPath = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
              if ($isccPath) { $iscc = Get-Item $isccPath }
            }
          }
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) is not available.' }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\dist" | Out-Null
          $payload = Join-Path $env:GITHUB_WORKSPACE "$env:LSP_SOURCE_DIR\INSTALL"
          $isccExe = if ($iscc.Source) { $iscc.Source } else { $iscc.FullName }
          & $isccExe "/DAppVersion=$env:LSP_VERSION" "/DPayloadDir=$payload" "/O$env:GITHUB_WORKSPACE\dist" "installer\lsp-plugins.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-windows-installer-${{ steps.source.outputs.version }}-${{ env.TOOLCHAIN }}
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0

      - name: Attach installer to GitHub release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No Windows installer was generated.' }
          gh release upload "$env:GITHUB_REF_NAME" $installer.FullName --repo $env:GITHUB_REPOSITORY --clobber

      - name: Upload Windows plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-windows-x86_64-${{ steps.source.outputs.version }}-${{ env.TOOLCHAIN }}
          path: ${{ env.LSP_SOURCE_DIR }}/INSTALL/
          if-no-files-found: error
          compression-level: 9
